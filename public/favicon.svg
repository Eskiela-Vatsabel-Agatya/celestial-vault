<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (#0B0F19 Astral Slate) -->
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>

    <!-- Top Facet (Electric Cyan #06B6D4) -->
    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Left Facet (Cosmic Violet #8B5CF6) -->
    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Right Facet (Deep Indigo Shadow) -->
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Star Core Glow (Celestial Gold #FACC15) -->
    <linearGradient id="starGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#312e81" stroke-width="2" />

  <!-- Subtle Outer Cyan Aura -->
  <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" stroke-linejoin="round" />

  <!-- Isometric Vault Cube: Top Lid -->
  <polygon points="32,10 52,21 32,32 12,21" fill="url(#topFacet)" />

  <!-- Isometric Vault Cube: Left Face -->
  <polygon points="12,21 32,32 32,54 12,43" fill="url(#leftFacet)" />

  <!-- Isometric Vault Cube: Right Face -->
  <polygon points="32,32 52,21 52,43 32,54" fill="url(#rightFacet)" />

  <!-- Vault Chest Seam / Rim Highlight -->
  <polyline points="12,27 32,38 52,27" fill="none" stroke="#0B0F19" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="12,21 32,32 52,21" fill="none" stroke="#cffafe" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />

  <!-- Central Celestial 4-Point Star Clasp / Keyhole -->
  <path d="M32,19 L35.5,28.5 L45,32 L35.5,35.5 L32,45 L28.5,35.5 L19,32 L28.5,28.5 Z" fill="#0B0F19" opacity="0.5" transform="translate(0, 1.5)" />
  <path d="M32,18 L35.2,28.8 L46,32 L35.2,35.2 L32,46 L28.8,35.2 L18,32 L28.8,28.8 Z" fill="url(#starGlow)" />

  <!-- Corner Sparkles -->
  <circle cx="16" cy="14" r="1.5" fill="#67e8f9" />
  <circle cx="49" cy="15" r="1.2" fill="#facc15" />
  <circle cx="48" cy="49" r="1.5" fill="#a855f7" />
</svg>